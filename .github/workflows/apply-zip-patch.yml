name: Showroom · ZIP & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'patch-*.zip'
      - '.github/workflows/apply-zip-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autosale-zip-patch-installer
  cancel-in-progress: false

jobs:
  apply-patch:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      commit_sha: ${{ steps.verified.outputs.sha }}
    name: Verify and apply ZIP patch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout uploaded patch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect uploaded ZIP
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ALL_CHANGED < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          mapfile -t PATCHES < <(printf '%s\n' "${ALL_CHANGED[@]}" | grep -E '^patch-[A-Za-z0-9._-]+\.zip$' || true)

          # Installing/updating this workflow itself also deploys the current main.
          if [ "${#PATCHES[@]}" -eq 0 ] && [ "${#ALL_CHANGED[@]}" -eq 1 ] && [ "${ALL_CHANGED[0]}" = '.github/workflows/apply-zip-patch.yml' ]; then
            echo "Workflow updated; deploy current main without a ZIP."
            exit 0
          fi

          if [ "${#PATCHES[@]}" -ne 1 ]; then
            echo "Exactly one root-level patch-*.zip must be uploaded in a patch commit."
            printf 'Changed files:\n%s\n' "${ALL_CHANGED[*]}"
            exit 1
          fi

          if [ "${#ALL_CHANGED[@]}" -ne 1 ]; then
            echo "Patch commit must contain only the ZIP file."
            printf 'Changed files:\n%s\n' "${ALL_CHANGED[*]}"
            exit 1
          fi

          PATCH_ZIP="${PATCHES[0]}"
          cp "$PATCH_ZIP" /tmp/autosale-patch.zip
          echo "zip=$PATCH_ZIP" >> "$GITHUB_OUTPUT"
          echo "Patch detected: $PATCH_ZIP"

      - name: Validate ZIP and apply paths safely
        if: ${{ steps.detect.outputs.zip != '' }}
        id: apply
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.detect.outputs.zip }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd().resolve()
          zip_path = Path('/tmp/autosale-patch.zip')
          patch_name = os.environ['PATCH_ZIP']

          MAX_TOTAL = 200 * 1024 * 1024
          MAX_FILE = 95 * 1024 * 1024
          SOURCE_EXTS = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.css'}

          # Patch ZIPs may never modify the installer itself or build outputs.
          PROTECTED_PREFIXES = (
              '.git/',
              '.github/workflows/',
              '.github/actions/',
              'node_modules/',
              '.next/',
              'out/',
          )
          PROTECTED_FILES = {
              '.env', '.env.local', '.env.production', '.env.development',
              'tsconfig.tsbuildinfo',
          }

          def clean_path(raw: str) -> str:
              if '\\' in raw:
                  raise ValueError(f'Backslashes are not allowed in ZIP paths: {raw!r}')
              if raw.startswith('/'):
                  raise ValueError(f'Absolute path is not allowed: {raw!r}')

              p = PurePosixPath(raw)
              parts = p.parts
              if not parts:
                  raise ValueError('Empty ZIP path is not allowed')
              if any(part in ('', '.', '..') for part in parts):
                  raise ValueError(f'Unsafe path component: {raw!r}')
              if any(part != part.strip() for part in parts):
                  raise ValueError(f'Leading/trailing whitespace in path component: {raw!r}')
              if any(any(ord(ch) < 32 for ch in part) for part in parts):
                  raise ValueError(f'Control character in path: {raw!r}')

              normalized = p.as_posix()
              low = normalized.lower()

              if low in PROTECTED_FILES:
                  raise ValueError(f'Protected file cannot be changed by ZIP patch: {normalized}')
              if any(low.startswith(prefix.lower()) for prefix in PROTECTED_PREFIXES):
                  raise ValueError(f'Protected path cannot be changed by ZIP patch: {normalized}')
              if re.fullmatch(r'patch-[A-Za-z0-9._-]+\.zip', normalized):
                  raise ValueError(f'Nested patch ZIP is not allowed: {normalized}')

              return normalized

          if not zip_path.is_file():
              raise SystemExit('Temporary patch ZIP is missing')

          with zipfile.ZipFile(zip_path) as zf:
              infos = [i for i in zf.infolist() if not i.is_dir()]
              if not infos:
                  raise SystemExit('Patch ZIP is empty')

              total = sum(i.file_size for i in infos)
              if total > MAX_TOTAL:
                  raise SystemExit(f'Patch is too large when unpacked: {total} bytes')

              seen = set()
              seen_lower = set()
              files = []
              manifest = None

              for info in infos:
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f'Symlink is not allowed in ZIP: {info.filename}')
                  if info.file_size > MAX_FILE:
                      raise SystemExit(f'File exceeds safe size limit: {info.filename}')

                  name = clean_path(info.filename)
                  if name in seen or name.lower() in seen_lower:
                      raise SystemExit(f'Duplicate/case-conflicting path in ZIP: {name}')
                  seen.add(name)
                  seen_lower.add(name.lower())

                  if name == '_patch.json':
                      try:
                          manifest = json.loads(zf.read(info).decode('utf-8'))
                      except Exception as exc:
                          raise SystemExit(f'Invalid _patch.json: {exc}')
                      continue

                  files.append((info, name))

              deletes = []
              message = None

              if manifest is not None:
                  if not isinstance(manifest, dict):
                      raise SystemExit('_patch.json must contain a JSON object')

                  raw_deletes = manifest.get('delete', [])
                  if not isinstance(raw_deletes, list) or not all(isinstance(x, str) for x in raw_deletes):
                      raise SystemExit('_patch.json "delete" must be an array of repository paths')

                  deletes = [clean_path(x) for x in raw_deletes]

                  if len({x.lower() for x in deletes}) != len(deletes):
                      raise SystemExit('Duplicate delete paths in _patch.json')

                  raw_message = manifest.get('message')
                  if raw_message is not None:
                      if not isinstance(raw_message, str) or not raw_message.strip():
                          raise SystemExit('_patch.json "message" must be a non-empty string')
                      message = raw_message.strip()[:120]

              if not files and not deletes:
                  raise SystemExit('Patch does not contain files or delete instructions')

              written = []

              for info, name in files:
                  target = (repo / name).resolve()
                  if repo not in target.parents:
                      raise SystemExit(f'Path escaped repository root: {name}')

                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, open(target, 'wb') as dst:
                      shutil.copyfileobj(src, dst)

                  written.append(name)

              deleted = []

              for name in deletes:
                  target = (repo / name).resolve()
                  if repo not in target.parents:
                      raise SystemExit(f'Delete path escaped repository root: {name}')

                  if target.is_dir():
                      shutil.rmtree(target)
                      deleted.append(name + '/')
                  elif target.exists():
                      target.unlink()
                      deleted.append(name)

          # Inbox ZIP is never part of the verified repository state.
          inbox = repo / patch_name
          if inbox.exists():
              inbox.unlink()

          # Guards for deployment-breaking source mistakes.
          for name in written:
              path = repo / name

              if path.suffix.lower() in SOURCE_EXTS and path.is_file() and path.stat().st_size == 0:
                  raise SystemExit(f'Rejected zero-byte source file: {name}')

              if name.endswith('/page.tsx') or name == 'page.tsx':
                  text = path.read_text('utf-8', errors='replace')
                  if not re.search(r'export\s+(?:default\b|\{[^}]*\bdefault\b[^}]*\}\s+from\b)', text):
                      raise SystemExit(f'Rejected page.tsx without a default export: {name}')

          # Save the exact patch-controlled paths. The commit step will stage ONLY these.
          Path('/tmp/patch-written.txt').write_text(
              ''.join(f'{x}\n' for x in written), encoding='utf-8'
          )
          Path('/tmp/patch-deleted.txt').write_text(
              ''.join(f'{x.rstrip("/")}\n' for x in deleted), encoding='utf-8'
          )

          if message:
              Path('/tmp/patch-commit-message.txt').write_text(message, encoding='utf-8')

          summary = Path(os.environ.get('GITHUB_STEP_SUMMARY', '/tmp/patch-summary.md'))
          with summary.open('a', encoding='utf-8') as f:
              f.write('## AutoSale ZIP patch\n\n')
              f.write(f'**ZIP:** `{patch_name}`\n\n')
              f.write(f'**Files written:** {len(written)}  \n')
              f.write(f'**Paths deleted:** {len(deleted)}\n\n')
              if written:
                  f.write('### Written\n')
                  for name in written:
                      f.write(f'- `{name}`\n')
              if deleted:
                  f.write('\n### Deleted\n')
                  for name in deleted:
                      f.write(f'- `{name}`\n')
          PY

          echo "ZIP paths validated and applied to temporary working tree."

      - name: Setup Node.js
        if: ${{ steps.detect.outputs.zip != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        if: ${{ steps.detect.outputs.zip != '' }}
        run: npm ci

      - name: TypeScript check
        if: ${{ steps.detect.outputs.zip != '' }}
        run: npm run typecheck

      - name: Production build
        if: ${{ steps.detect.outputs.zip != '' }}
        run: npm run build

      - name: Remove generated build artifacts before commit
        if: ${{ steps.detect.outputs.zip != '' }}
        shell: bash
        run: |
          set -euo pipefail

          # Build output must NEVER be committed to the repository.
          rm -rf node_modules .next out
          rm -f tsconfig.tsbuildinfo

          echo "Generated build artifacts removed from working tree."

      - name: Commit only verified patch files
        if: ${{ steps.detect.outputs.zip != '' }}
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.detect.outputs.zip }}
        run: |
          set -euo pipefail

          git config user.name "autosale-patch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never use `git add -A` globally here.
          # Stage only the uploaded ZIP deletion, patch-controlled files,
          # and cleanup of build artifacts accidentally tracked by an older installer.
          git add -A -- "$PATCH_ZIP"

          if [ -s /tmp/patch-written.txt ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git add -A -- "$path"
            done < /tmp/patch-written.txt
          fi

          if [ -s /tmp/patch-deleted.txt ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git add -A -- "$path"
            done < /tmp/patch-deleted.txt
          fi

          # One-time and future-proof cleanup if these were ever tracked.
          git add -A -- .next node_modules out tsconfig.tsbuildinfo 2>/dev/null || true

          # Safety check: reject any staged path outside the allowed set.
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          patch_zip = os.environ['PATCH_ZIP']
          allowed = {patch_zip, '.next', 'node_modules', 'out', 'tsconfig.tsbuildinfo'}

          for list_file in ('/tmp/patch-written.txt', '/tmp/patch-deleted.txt'):
              p = Path(list_file)
              if p.exists():
                  allowed.update(x.strip() for x in p.read_text('utf-8').splitlines() if x.strip())

          staged = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']
          ).decode('utf-8').split('\0')

          unexpected = []
          for path in filter(None, staged):
              if path in allowed:
                  continue
              if any(path.startswith(prefix.rstrip('/') + '/') for prefix in ('.next', 'node_modules', 'out')):
                  continue
              unexpected.append(path)

          if unexpected:
              raise SystemExit(
                  'Refusing commit because unexpected files were staged:\n' +
                  '\n'.join(f'- {x}' for x in unexpected)
              )
          PY

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Nothing changed after verification."
            exit 0
          fi

          if [ -s /tmp/patch-commit-message.txt ]; then
            MSG="$(cat /tmp/patch-commit-message.txt)"
          else
            MSG="Apply verified ZIP patch: ${PATCH_ZIP}"
          fi

          git commit -m "$MSG"
          git push origin HEAD:main

      - name: Export verified commit
        id: verified
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove rejected ZIP from main
        if: ${{ failure() && steps.detect.outputs.zip != '' }}
        shell: bash
        env:
          PATCH_ZIP: ${{ steps.detect.outputs.zip }}
        run: |
          set +e

          # Restore source tree to exactly the uploaded-patch commit.
          git reset --hard "$GITHUB_SHA"
          git clean -fd

          # Remove only the rejected inbox ZIP and commit that deletion.
          if [ -n "$PATCH_ZIP" ] && [ -f "$PATCH_ZIP" ]; then
            rm -f "$PATCH_ZIP"

            git config user.name "autosale-patch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A -- "$PATCH_ZIP"

            if ! git diff --cached --quiet; then
              git commit -m "Remove rejected ZIP patch: ${PATCH_ZIP}"
              git push origin HEAD:main
            fi
          fi

          echo "Rejected patch was not applied to source files."

  deploy:
    name: Deploy unified Showroom Backend
    needs: apply-patch
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.apply-patch.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.apply-patch.result == 'skipped')) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTH_PEPPER: ${{ secrets.AUTH_PEPPER }}
      SETUP_KEY: ${{ secrets.SETUP_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-patch.outputs.commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo 'Missing or invalid CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test ${#AUTH_PEPPER} -ge 32 && test ${#SETUP_KEY} -ge 32 || { echo 'Set AUTH_PEPPER and SETUP_KEY (at least 32 characters each)'; exit 1; }
          test "$AUTH_PEPPER" != "$SETUP_KEY" || { echo 'Use two different secrets'; exit 1; }
          test -f backend/worker.ts && test -f scripts/configure-worker.mjs && test -f migrations/0001_clean_baseline.sql || { echo 'Install the unified backend ZIP first'; exit 1; }
      - run: npm ci
      - run: npm run build
      - name: Discover or provision Cloudflare resources
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error, urllib.parse
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          root = '/accounts/' + account
          base = 'https://api.cloudflare.com/client/v4'
          worker = 'autosaleumar-backend'
          dbname = 'autosaleumar-db'
          bucket = 'autosaleumar-media'
          expected = {'autosaleumar.com', 'www.autosaleumar.com', 'api.autosaleumar.com', 'display.autosaleumar.com'}
          def cf(path, method='GET', body=None, query=None):
              url = base + path + (('?' + urllib.parse.urlencode(query)) if query else '')
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization':'Bearer '+token, 'Content-Type':'application/json'}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as res:
                      obj = json.load(res)
              except urllib.error.HTTPError as exc:
                  try: errors = json.loads(exc.read()).get('errors', [])
                  except Exception: errors = []
                  raise SystemExit(f'{method} {path}: HTTP {exc.code}; {errors}')
              if not obj.get('success'):
                  raise SystemExit(f'{method} {path}: {obj.get("errors", [])}')
              return obj
          sub = cf(root+'/workers/subdomain')['result']['subdomain']
          if not re.fullmatch(r'[a-z0-9-]+', sub or ''):
              raise SystemExit('Configure an account workers.dev subdomain before deploying.')
          # Preserve existing production domains on ordinary re-deploys.
          current = set()
          page = 1
          while True:
              r = cf(root+'/workers/domains', query={'service':worker,'page':page,'per_page':100})
              current.update(x['hostname'] for x in r['result'] if x.get('service') == worker)
              if page >= (r.get('result_info') or {}).get('total_pages', 1): break
              page += 1
          if current - expected:
              raise SystemExit('Unexpected custom domains on target Worker; refusing to alter routing.')
          zones = cf('/zones', query={'name':'autosaleumar.com','account.id':account})['result']
          active = any(z.get('name')=='autosaleumar.com' and z.get('status')=='active' and z.get('account',{}).get('id')==account for z in zones)
          if current and not active:
              raise SystemExit('Existing production routes found but zone is not active; refusing to alter routing.')
          # Deploy and verify preview before attaching new domains. Preserve existing routes.
          attach = bool(current)
          attach_after_verify = active and not current
          print('Domain:', 'active' if active else 'pending or absent; preview only')
          # Exact resource names only; never copy, delete, or reset data.
          matches = []
          page = 1
          while True:
              r = cf(root+'/d1/database', query={'name':dbname,'page':page,'per_page':100})
              matches.extend(x for x in r['result'] if x.get('name')==dbname)
              info = r.get('result_info') or {}
              if len(r['result']) < 100 or page*100 >= info.get('total_count', float('inf')): break
              page += 1
          if len(matches)>1: raise SystemExit('Multiple matching D1 databases; refusing ambiguous target.')
          db = matches[0] if matches else cf(root+'/d1/database','POST',{'name':dbname})['result']
          dbid = db['uuid']
          assert db['name']==dbname and re.fullmatch(r'[0-9a-fA-F-]{36}', dbid)
          print('D1:', 'reused' if matches else 'created', dbname)
          # Filter + cursor pagination; do not treat API failures as missing buckets.
          found = False
          cursor = None
          while True:
              q = {'name_contains':bucket,'per_page':100}
              if cursor: q['cursor'] = cursor
              r = cf(root+'/r2/buckets', query=q)
              if any(x['name']==bucket for x in r['result']['buckets']):
                  found = True; break
              cursor = (r.get('result_info') or {}).get('cursor')
              if not cursor: break
          if not found:
              created = cf(root+'/r2/buckets','POST',{'name':bucket})['result']
              assert created['name']==bucket
          print('R2:', 'reused' if found else 'created', bucket)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'ASU_D1_DATABASE_ID={dbid}\nASU_ATTACH_DOMAINS={str(attach).lower()}\nASU_ATTACH_AFTER_VERIFY={str(attach_after_verify).lower()}\nASU_PREVIEW_URL=https://{worker}.{sub}.workers.dev\n')
          PY
      - name: Generate configuration and apply schema
        run: |
          set -euo pipefail
          node scripts/configure-worker.mjs
          npx --yes wrangler@4 d1 migrations apply autosaleumar-db --remote --config wrangler.generated.json
      - name: Deploy unified Worker, assets and secrets
        run: |
          set -euo pipefail
          umask 077
          secret_file="$RUNNER_TEMP/asu-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          python - <<'PY' > "$secret_file"
          import json, os
          print(json.dumps({k:os.environ[k] for k in ['AUTH_PEPPER','SETUP_KEY','GEMINI_API_KEY'] if os.environ.get(k)}))
          PY
          npx --yes wrangler@4 deploy --config wrangler.generated.json --secrets-file "$secret_file"
      - name: Verify preview backend, catalog and website
        run: |
          set -euo pipefail
          verify() {
            curl --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 -fsS "$1/v1/health" | python -c 'import json,sys; assert json.load(sys.stdin)["success"] is True'
            curl --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 -fsS "$1/v1/cars" | python -c 'import json,sys; x=json.load(sys.stdin); assert x["success"] and isinstance(x["cars"],list); print("Catalog count:",len(x["cars"]))'
          }
          verify "$ASU_PREVIEW_URL"
          curl --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 -fsS "$ASU_PREVIEW_URL/api/catalog" | python -c 'import json,sys; x=json.load(sys.stdin); assert x["success"] and isinstance(x["cars"],list)'
          curl -fsSL --max-time 30 "$ASU_PREVIEW_URL/display/" -o /dev/null
      - name: Attach active production domains after preview verification
        if: ${{ env.ASU_ATTACH_AFTER_VERIFY == 'true' }}
        env:
          ASU_ATTACH_DOMAINS: 'true'
        run: |
          set -euo pipefail
          node scripts/configure-worker.mjs
          umask 077
          secret_file="$RUNNER_TEMP/asu-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          python - <<'PY' > "$secret_file"
          import json, os
          print(json.dumps({k:os.environ[k] for k in ['AUTH_PEPPER','SETUP_KEY','GEMINI_API_KEY'] if os.environ.get(k)}))
          PY
          npx --yes wrangler@4 deploy --config wrangler.generated.json --secrets-file "$secret_file"
          echo "ASU_ATTACH_DOMAINS=true" >> "$GITHUB_ENV"
      - name: Verify production and publish deployment summary
        run: |
          set -euo pipefail
          verify() {
            curl --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 -fsS "$1/v1/health" | python -c 'import json,sys; assert json.load(sys.stdin)["success"] is True'
            curl --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 -fsS "$1/v1/cars" | python -c 'import json,sys; x=json.load(sys.stdin); assert x["success"] and isinstance(x["cars"],list); print("Catalog count:",len(x["cars"]))'
          }
          if [[ "$ASU_ATTACH_DOMAINS" == true ]]; then
            verify https://api.autosaleumar.com
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 https://autosaleumar.com/ -o /dev/null
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 https://display.autosaleumar.com/ -o /dev/null
          fi
          {
            echo '## Showroom Backend deployed'
            echo "- Preview: $ASU_PREVIEW_URL"
            echo "- First administrator: $ASU_PREVIEW_URL/admin/setup/"
            echo "- TV: $ASU_PREVIEW_URL/display/"
            echo "- Production domains: $ASU_ATTACH_DOMAINS"
            if [[ "$ASU_ATTACH_DOMAINS" != true ]]; then echo '- After nameservers become active, upload the next ZIP or run this workflow once manually.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
